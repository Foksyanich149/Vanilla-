 SOV_manager_of_ONPO:0 "Заведующий ОРПО"
 SOV_manager_of_ONPO_desc:0 "Отдел руководящий партийных органов ЦК ВКП(б) являлся специальной группой людей, целью которого был жёсткий контроль за краевыми, областными и районными комитетами партии. Отдел проводил учёт кадров, оформлял назначения и утверждения работников."
