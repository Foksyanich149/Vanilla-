 personal_agenda_von_hesse:0 "\n£GFX_power_balance_texticon §Y$personal_agenda$§!"
 losing_soverignty_threatened_tt:0 "§RУгроза финскому суверенитету§!: потеря контроля над финской национальной территорией снизит £GFX_power_balance_texticon §Yпубличное доверие§!."
 FIN_personal_agenda_svinhufvud_tt:0 "§GИскоренить социализм§!: уровень поддержки идеологий «$democratic$» и «$communism$» ниже §Y1%§! увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt:0 "§GИскоренить экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» ниже §Y1%§! увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – §RОпасно высокая поддержка экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt:0 "§GМечта о Великой Финляндии§!: оккупация финских национальных территорий, занятых врагом, увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt:0 "§GНадежный лидер§!: нахождение в состоянии войны увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – §RНазначенный регент§!: нахождение в состоянии мира снизит £GFX_power_balance_texticon §Yпубличное доверие§!."
 FIN_personal_agenda_paasikivi_tt:0 "§GКонсерватор-реалист§!: £GFX_stability_texticon $stability$ выше §Y95%§! увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – §RОпекун§!: £GFX_stability_texticon $stability$ ниже §Y60%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n  – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt:0 "§GСильная нация§!: £GFX_manpower_texticon $MANPOWER$ более §Y300 000§! в действующих войсках и процесс капитуляции ниже §Y5%§! во время войны повышают £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снижает £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt:0 "§GОбъединенная нация§!: контроль над §YКарелией§! и каждым входящим в нее регионом при уровне поддержки идеологи «$democratic$» выше §Y95%§! повышает £GFX_power_balance_texticon §Yпубличное доверие§!. \n – §RОпасно высокая поддержка экстремистов§!: уровень поддержки идеологий «$fascism$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_aaltonen_tt:0 "§GКрестовый поход против фашизма§!: участие более §Y10%§! во всех активных войнах и процесс капитуляции ниже §Y5%§! во время войны против фашистской страны повышают £GFX_power_balance_texticon §Yпубличное доверие§!. \n – §RРасколотый пролетариат§!: уровень поддержки идеологии «$communism$» ниже §Y80%§! снижает £GFX_power_balance_texticon §Yпубличное доверие§!. \n – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt:0 "§GЕвропейский фашизм истреблен§!: уровень поддержки идеологии «$fascism$» ниже §Y1%§! при отсутствии в Европе фашистских правительств повышает £GFX_power_balance_texticon §Yпубличное доверие§!. \n — §RРасколотый пролетариат§!: уровень поддержки идеологии «$communism$» ниже §Y80%§! снижает £GFX_power_balance_texticon §Yпубличное доверие§!. \n — $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt:0 "§GСолнечная система организаций§!: все §Yскандинавские§! и §Yбалтийские национальные территории§! под контролем Финляндии или ее союзника повышают £GFX_power_balance_texticon §Yпубличное доверие§!. \n – §RЗабытые карело-финны§!: регионы §YКарелия§!, §YКола§!, §YОнега§! и §YОлонец§! под чужим контролем снижают £GFX_power_balance_texticon §Yпубличное доверие§!. \n – $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_von_hesse_tt:0 "§GМечта о Великой Финляндии§!: оккупация финских национальных территорий, занятых врагом, увеличит £GFX_power_balance_texticon §Yпубличное доверие§!. \n – §RОпасно высокая поддержка социалистов§!: уровень поддержки идеологий «$democratic$» и «$communism$» выше §Y9%§! снизит £GFX_power_balance_texticon §Yпубличное доверие§!. \n – $losing_soverignty_threatened_tt$"
