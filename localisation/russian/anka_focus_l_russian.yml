l_russian:
 SOV_independent_path:0 "Независимый путь"
 SOV_lend_lease_from_allies:0 "Принять ленд-лиз от США"
 SOV_independent_path_desc:0 "Ни капиталистический Запад, ни фашистский Берлин не могут быть надёжными партнёрами для Советского Союза. Любые соглашения с ними — лишь временная передышка, купленная ценой уступок. Наша сила — в собственных ресурсах, промышленности и единстве народа. Безопасность СССР будет обеспечена не чужими гарантиями, а нашей собственной мощью."
 SOV_lend_lease_from_allies_desc:0 "Независимость не означает самоубийство. Когда враг у ворот, гордость уступает место расчёту. Американские поставки — не союз и не уступка, а топливо, грузовики и винтовки, которые так необходимы нашим солдатам на поле боя."
