 POL_purchase_madagascar:0 "Приобрести Мадагаскар"
 POL_anti_fascist_military:0 "Военные против фашизма"
 POL_purchase_madagascar_desc:0 "Мадагаскар — чужеродное нам место, чья флора и фауна незнакомы полякам. Многие считают, что из-за этого остров будет малопригоден для проживания нашего народа, но есть и те, кто видит в этом возможность начать абсолютно новую жизнь. Благодаря своему размеру и потенциально имеющимся ресурсам остров в крайнем случае идеально подойдёт для размещения нашего народа."
