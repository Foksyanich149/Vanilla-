 wtt_germany.1007.t:0 "Офицеры вермахта бросают вызов Гитлеру"
 wtt_germany.1007.d:0 "Скрытое недовольство политикой Гитлера проявилось в текущем кризисе, вызванном намерением администрации произвести ремилитаризацию Рейнской области. Ряд генералов вермахта примкнули к прославленному фельдмаршалу Августу фон Макензену, разработавшему план по свержению Гитлера и отстранению нацистов от власти в Германии.\n\nКогда о расколе в высшем руководстве Германии стало известно даже за рубежом, другие страны решили не протестовать против ремилитаризации, более озабоченные растущей нестабильностью внутри Германии. Стареющий фельдмаршал не стал медлить и уже создал временное правительство, под знамёна которого стекаются противники нацистов.\n\nВоенный переворот не за горами."
 wtt_germany.1007.a:0 "Прогоним нацистских подонков с нашей земли!"
