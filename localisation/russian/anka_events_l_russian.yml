 idassafv.1.t:0 "[ITA.GetLeader] требует регион [846.GetName]"
 idassafv.1.desc:0 "Совершив нечто абсолютно неожиданное и возмутительное, итальянский лидер [ITA.GetLeader] осквернил наш давний нейтралитет, вручив нам ультиматум. В течение двух недель мы должны передать регион [846.GetName] итальянцам, иначе будет война. Что мы ответим?"
 idassafv.1.a:0 "Одной уязвимой точкой для обороны меньше"
 idassafv.1.b:0 "Ну, пусть попробуют!"
