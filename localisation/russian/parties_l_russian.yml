 emperor_fascism:0 "Японский фашизм"
 emperor_fascism_desc:0 "Японский фашизм — это форма ультранационализма, при которой массы не имеют права голоса. Часто такую систему называют «фашизм сверху». Власть удерживается военными и чиновниками-аристократами, а идеология превозносит императора — монарха, который считается непогрешимой божественной фигурой."
 japan_militarism_ideology:0 "Милитаризм"
 japan_militarism_ideology_desc:0 "Милитаризм это идеология, в которой лидер нации обладает лишь номинальной властью и выступает не как независимый политик, а скорее как марионетка в руках военных, постоянно продвигая их интересы и проводя политику стремительной экспансии."
 buddhist_socialism:0 "Буддистский социализм"
 buddhist_socialism_desc:0 "Буддистский, он же дхармический или природный социализм, — политическая идеология, объединяющая принципы буддизма и социализма. Теория основывается на схожести этих учений, поскольку они преследуют одну цель — выяснить истинные причины страдания и устранить их на практике, а также изменить сознание личности ради преодоления отчужденности и эгоизма."
