l_english:
 idassafv.1.t:0 "[ITA.GetLeader] Demands [846.GetName]"
 idassafv.1.desc:0 "In a completely unexpected and outrageous move, the Italian leader [ITA.GetLeader] has defiled our longstanding neutrality by handing us an ultimatum. Within two weeks, we need to hand over the region of [846.GetName] to the Italians, or we will have war. How should we respond?"
 idassafv.1.a:0 "That's one less weak-point for us to defend"
 idassafv.1.b:0 "We'd like to see them try!"
